<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pense comme un robot conversationnel (LLM) : biais et éthique</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#1d1d1f; --muted:#5d5d63;
    --accent:#2b4cc4; --accent-soft:#e3e8fb; --good:#1f8a4c; --good-soft:#e2f4ea;
    --bad:#b3362c; --bad-soft:#fbe5e2; --warn:#a86a00; --line:#ddd8cc;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:#111;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
  header img{height:56px;background:#fff;border-radius:6px;padding:3px}
  header h1{font-size:1.25rem;margin:0}
  header p{margin:0;font-size:.85rem;opacity:.8}
  main{max-width:820px;margin:24px auto;padding:0 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.9rem;color:var(--muted)}
  .progress{flex:1;height:8px;background:var(--line);border-radius:4px;margin:0 14px;overflow:hidden}
  .progress div{height:100%;background:var(--accent);transition:width .4s}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:20px;margin-bottom:10px}
  h2{margin:.2em 0 .5em;font-size:1.35rem}
  .prompt{font-size:1.25rem;background:#faf8f3;border-left:4px solid var(--accent);padding:14px 16px;border-radius:6px;margin:12px 0 18px}
  .prompt .blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--accent);color:var(--accent);font-weight:700;text-align:center}
  .ctx{font-size:.9rem;color:var(--muted);margin-bottom:-8px}
  .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  button{font:inherit;cursor:pointer}
  .opt{background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .opt:disabled{cursor:default;opacity:1;color:var(--ink)}
  .opt.chosen{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
  .opt.correct{border-color:var(--good);background:var(--good-soft)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:700}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .feedback{margin-top:20px;padding:16px 18px;border-radius:10px;background:#faf8f3;border:1px solid var(--line)}
  .feedback h3{margin:0 0 8px;font-size:1.05rem}
  .feedback.good{border-color:var(--good);background:var(--good-soft)}
  .feedback.mid{border-color:var(--warn);background:#fff6e0}
  .feedback.bad{border-color:var(--bad);background:var(--bad-soft)}
  .bars{margin:12px 0}
  .bar{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:10px;margin:6px 0;font-size:.95rem}
  .bar .track{background:#ece8de;border-radius:5px;height:20px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);width:0;transition:width .6s ease}
  .bar.me .fill{background:var(--warn)}
  .bar.me .lbl{font-weight:700}
  .bar .pct{text-align:right;font-variant-numeric:tabular-nums}
  .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lesson{background:#fff;border-radius:8px;padding:10px 14px;margin-top:10px;border-left:4px solid var(--accent);font-size:.95rem}
  .lesson b{color:var(--accent)}
  .sample-out{margin-top:10px;font-size:.95rem}
  .chip{display:inline-block;padding:2px 8px;margin:2px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:.85rem}
  .chip.top{background:var(--accent);color:#fff}
  .slider{display:flex;align-items:center;gap:12px;margin:10px 0}
  .slider input{flex:1}
  .tokens span{display:inline-block;padding:4px 8px;margin:2px;border-radius:6px;font-family:ui-monospace,Menlo,monospace}
  .sentence{font-size:1.2rem;margin:10px 0}
  .sentence .w{background:var(--accent-soft);padding:2px 6px;border-radius:6px;margin:0 2px}
  .calc{font-family:ui-monospace,Menlo,monospace;font-size:.9rem;background:#fff;padding:8px 10px;border-radius:6px;overflow-x:auto}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gen{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:14px}
  .gen b{display:block;margin-bottom:6px}
  @media (max-width:600px){.two{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 46px}}
  .note{font-size:.82rem;color:var(--muted);margin-top:14px}
  .score-big{font-size:3rem;font-weight:800;color:var(--accent);margin:0}
  ul.recap li{margin:6px 0}
  footer{max-width:820px;margin:0 auto 30px;padding:0 16px;font-size:.85rem;color:var(--muted);display:flex;gap:14px;align-items:center}
  footer img{height:54px}
  footer a{color:var(--accent)}
  .pill{display:inline-block;background:#111;color:#fff;font-weight:700;padding:2px 10px;border-radius:12px;font-size:.78rem}
</style>
</head>

   MOTEUR DU JEU
   ============================================================ */
const app = document.getElementById("app");
let idx = -1, score = 0, maxScore = 0, log = [];
const GAME_TITLE = `Pense comme un robot conversationnel (LLM) : biais et éthique`;
const RECAP = [
  `🌡️ <b>Température</b> : un réglage qui rend le texte plus prévisible ou plus créatif, mais aussi plus risqué.`,
  `🔗 <b>Mot par mot</b> : le modèle ne revient jamais en arrière; une phrase probable est souvent banale.`,
  `⚠️ <b>Probable ≠ vrai</b> : une réponse peut être fluide, convaincante… et inventée (hallucination). Vérifie les sources.`,
  `⚖️ <b>Biais</b> : les probabilités viennent de textes humains et reproduisent, parfois en les amplifiant, nos stéréotypes.`,
  `🌍 <b>Inclusion</b> : les langues et les cultures peu présentes en ligne sont moins bien servies.`,
  `🏛️ <b>Équité</b> : une IA entraînée sur des décisions passées inégales peut automatiser la discrimination.`,
  `🔍 <b>Transparence</b> : le modèle est une boîte noire; les organisations doivent dire quand et comment elles utilisent l'IA.`
];
const txt = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); };
const pct = p => (p*100).toFixed(p<0.1 && p>0 ? 1 : 0).replace(".",",")+" %";

function sample(opts){ let r=Math.random(), acc=0; for(const [w,p] of opts){acc+=p; if(r<=acc) return w;} return opts[opts.length-1][0]; }
function softmax(logits,T){ const ex=logits.map(([w,l])=>[w,Math.exp(l/T)]); const s=ex.reduce((a,[,v])=>a+v,0); return ex.map(([w,v])=>[w,v/s]); }

function barsHTML(opts, chosen){
  const sorted=[...opts].sort((a,b)=>b[1]-a[1]);
  return `<div class="bars">${sorted.map(([w,p])=>`
    <div class="bar ${w===chosen?'me':''}"><span class="lbl" title="${w}">${w}${w===chosen?' ← toi':''}</span>
    <div class="track"><div class="fill" data-w="${p*100}"></div></div><span class="pct">${pct(p)}</span></div>`).join("")}</div>`;
}
function animateBars(root=app){ requestAnimationFrame(()=>root.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%")); }

function topbar(){
  const n=ROUNDS.length;
  return `<div class="topbar"><span>Manche ${idx+1} / ${n}</span><div class="progress"><div style="width:${(idx)/n*100}%"></div></div><span>Score : <b>${score}</b></span></div>`;
}
function nextBtn(){ return `<div class="row"><button class="btn" onclick="go()">${idx===ROUNDS.length-1?'Voir mon bilan':'Manche suivante →'}</button></div>`; }

function intro(){
  app.innerHTML = `
    <span class="tag">Bienvenue</span>
    <h2>Quand les probabilités deviennent un enjeu éthique</h2>
    <p>Tu sais déjà qu'un <b>grand modèle de langage</b> (LLM) prédit la suite la plus probable d'un texte, jeton après jeton. Mais d'où viennent ces probabilités? Et qu'arrive-t-il quand on s'y fie pour informer, écrire ou décider?</p>
    <p>Dans ce jeu de ${ROUNDS.length} manches, tu vas explorer :</p>
    <ul>
      <li>la <b>température</b> et la construction d'une phrase mot par mot;</li>
      <li>les <b>hallucinations</b> : quand le probable n'est pas le vrai;</li>
      <li>les <b>biais</b>, l'<b>inclusion</b>, l'<b>équité</b> et la <b>transparence</b>.</li>
    </ul>
    <p>Quand tu prédis un mot, tu gagnes des points selon sa probabilité : plus tu « penses comme le modèle », plus tu marques de points. <i>Mais attention : penser comme le modèle n'est pas toujours avoir raison!</i></p>
    <p class="note">Les probabilités affichées sont des exemples simplifiés, conçus pour imiter le comportement d'un vrai modèle. Elles ne proviennent pas d'un modèle précis.</p>
    <div class="row"><button class="btn" onclick="go()">Commencer le jeu</button></div>`;
}

function go(){ idx++; if(idx>=ROUNDS.length) return end(); const r=ROUNDS[idx]; ({next:rNext,temp:rTemp,chain:rChain,mcq:rMcq})[r.type](r); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---- Manche : prédire le mot suivant ---- */
function rNext(r){
  maxScore+=100;
  const shuffled=[...r.options].sort(()=>Math.random()-.5);
  app.innerHTML = topbar()+`<span class="tag">${r.tag}</span><h2>${r.title}</h2>
    ${r.context?`<p class="ctx">${r.context}</p>`:""}
    <div class="prompt">${r.prompt} <span class="blank">?</span></div>
    <p>Quel mot le modèle juge-t-il le <b>plus probable</b> ensuite?</p>
    <div class="options">${shuffled.map(([w])=>`<button class="opt" data-w="${w}">${w}</button>`).join("")}</div>
    <div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const w=b.dataset.w, p=r.options.find(o=>o[0]===w)[1];
    const best=Math.max(...r.options.map(o=>o[1]));
    const pts=Math.round(p/best*100); score+=pts;
    const fav=[...r.options].sort((x,y)=>y[1]-x[1])[0];
    log.push(`${r.title} — « ${r.prompt} ___ » — Mon choix : ${w} (${pct(p)}). Favori du modèle : ${fav[0]} (${pct(fav[1])}). +${pts} pts`);
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.w===w) x.classList.add("chosen");});
    app.querySelector(".prompt .blank").textContent=w;
    const cls = pts>=90?"good":pts>=40?"mid":"bad";
    const title = pts>=90?`Tu penses comme le modèle! +${pts} points`:pts>=40?`Plausible, mais pas le favori. +${pts} points`:`Peu probable pour le modèle. +${pts} points`;
    app.querySelector("#fb").innerHTML = `<div class="feedback ${cls}"><h3>${title}</h3>
      <div>Voici les probabilités (illustratives) que le modèle attribue à chaque suite :</div>${barsHTML(r.options,w)}
      ${r.compare?`<div style="margin-top:10px"><b>${r.compare.label}</b></div>${barsHTML(r.compare.options)}`:""}
      <div class="row" style="margin-top:6px"><button class="btn ghost" id="samp">🎲 Laisse l'IA tirer 20 fois</button></div>
      <div class="sample-out" id="sout"></div>
      <div class="lesson">${r.lesson}</div></div>${nextBtn()}`;
    animateBars();
    document.getElementById("samp").onclick=()=>{
      const top=[...r.options].sort((a,b)=>b[1]-a[1])[0][0];
      const res=Array.from({length:20},()=>sample(r.options));
      const counts={}; res.forEach(x=>counts[x]=(counts[x]||0)+1);
      document.getElementById("sout").innerHTML = `<div>${res.map(x=>`<span class="chip ${x===top?'top':''}">${x}</span>`).join("")}</div>
        <div style="margin-top:6px">Résultat : ${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`<b>${w}</b> ${c} fois`).join(", ")}. Clique encore : le résultat change!</div>`;
    };
    document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

/* ---- Manche : température ---- */
function rTemp(r){
  maxScore+=100;
  app.innerHTML = topbar()+`<span class="tag">${r.tag}</span><h2>${r.title}</h2>
    <p>${r.question}</p>
    <div class="two">
      <button class="opt gen" data-k="a"><b>Réponse A</b>${r.a}</button>
      <button class="opt gen" data-k="b"><b>Réponse B</b>${r.b}</button>
    </div><div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.k===r.answer; if(ok) score+=100;
    log.push(`${r.title} — Mon choix : réponse ${b.dataset.k.toUpperCase()} (${ok?'bonne réponse':'mauvaise réponse'}). +${ok?100:0} pts`);
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.k===r.answer) x.classList.add("correct"); else if(x===b) x.classList.add("wrong");});
    app.querySelector("#fb").innerHTML = `<div class="feedback ${ok?'good':'bad'}"><h3>${ok?'Exact! +100 points':'Pas tout à fait.'}</h3>
      <p>La réponse B est plus surprenante et imagée : à haute température, le modèle a pioché des mots moins probables (« vécu », « mille hivers »). La réponse A est la suite « attendue », typique d'une température basse.</p>
      <div class="lesson">${r.lesson}</div>
      <h3 style="margin-top:16px">🔬 Laboratoire : « ${r.lab.prompt} … »</h3>
      <div class="slider"><span>Température</span><input type="range" id="T" min="0.1" max="2" step="0.1" value="1"><b id="Tv">1,0</b></div>
      <div id="lab"></div>
      <div class="row"><button class="btn ghost" id="samp">🎲 Tirer 20 fois à cette température</button></div>
      <div class="sample-out" id="sout"></div></div>${nextBtn()}`;
    const draw=()=>{ const T=+document.getElementById("T").value; document.getElementById("Tv").textContent=T.toFixed(1).replace(".",",");
      document.getElementById("lab").innerHTML=barsHTML(softmax(r.lab.logits,T)); app.querySelectorAll("#lab .fill").forEach(f=>{f.style.transition="none";f.style.width=f.dataset.w+"%";}); };
    document.getElementById("T").oninput=draw; draw();
    document.getElementById("samp").onclick=()=>{
      const T=+document.getElementById("T").value, d=softmax(r.lab.logits,T);
      const res=Array.from({length:20},()=>sample(d)); const counts={}; res.forEach(x=>counts[x]=(counts[x]||0)+1);
      document.getElementById("sout").innerHTML=`<div>${res.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
        <div style="margin-top:6px">${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`<b>${w}</b> ${c}`).join(" · ")} — Essaie avec 0,1 puis avec 2,0 : que remarques-tu?</div>`;
    };
    document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

/* ---- Manche : construire une phrase ---- */
function rChain(r){
  maxScore+=100;
  let node=r.tree, words=[], probs=[];
  const render=()=>{
    const done=!node;
    app.innerHTML = topbar()+`<span class="tag">${r.tag}</span><h2>${r.title}</h2><p>${r.intro}</p>
      <div class="prompt">${r.start} ${words.map(w=>`<span class="w" style="background:#e3e8fb;padding:2px 6px;border-radius:6px">${w}</span>`).join(" ")} ${done?".":'<span class="blank">?</span>'}</div>
      ${done?"":`<p>Étape ${words.length+1} / 3 — choisis le mot suivant :</p>
      <div class="options">${node.opts.map(([w,p])=>`<button class="opt" data-w="${w}">${w}</button>`).join("")}</div>`}
      <div id="fb"></div>`;
    if(!done){
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const w=b.dataset.w, p=node.opts.find(o=>o[0]===w)[1];
        words.push(w); probs.push(p);
        node = node.next ? node.next[w] : null;
        if(words.length>=3) node=null;
        render();
      });
    } else finish();
  };
  const finish=()=>{
    const total=probs.reduce((a,b)=>a*b,1);
    const pts=Math.min(100,Math.round(total/0.35*100)); score+=pts;
    log.push(`${r.title} — Ma phrase : « ${r.start} ${words.join(' ')}. » Probabilité : ${pct(total)}. +${pts} pts`);
    app.querySelector("#fb").innerHTML=`<div class="feedback ${pts>=60?'good':'mid'}"><h3>Ta phrase : « ${r.start} ${words.join(" ")}. » +${pts} points</h3>
      <p>Probabilité de chaque choix, puis probabilité de la phrase entière :</p>
      <div class="calc">${probs.map((p,i)=>`P(${words[i]}) = ${p.toFixed(2).replace(".",",")}`).join("<br>")}<br>————————<br>
      ${probs.map(p=>p.toFixed(2).replace(".",",")).join(" × ")} = <b>${total.toFixed(3).replace(".",",")}</b> (≈ ${pct(total)})</div>
      <p>${total>0.15?"Ta phrase est l'une des plus probables : c'est le genre de phrase qu'un LLM produit souvent.":total>0.05?"Ta phrase est plausible, mais un LLM ne la produirait pas à tous les coups.":"Ta phrase est rare pour le modèle : il la produirait seulement de temps en temps, surtout à température élevée."}</p>
      <div class="lesson">${r.lesson}</div>
      <div class="row"><button class="btn ghost" id="ai">🤖 Laisse l'IA écrire 5 phrases</button></div><div class="sample-out" id="sout"></div></div>${nextBtn()}`;
    document.getElementById("ai").onclick=()=>{
      const lines=[];
      for(let k=0;k<5;k++){ let n=r.tree, ws=[], ps=[]; while(n && ws.length<3){ const w=sample(n.opts); ps.push(n.opts.find(o=>o[0]===w)[1]); ws.push(w); n=n.next?n.next[w]:null; }
        lines.push(`« ${r.start} ${ws.join(" ")}. » <small>(${pct(ps.reduce((a,b)=>a*b,1))})</small>`); }
      document.getElementById("sout").innerHTML=lines.map(l=>`<div>${l}</div>`).join("")+`<div class="note">Même point de départ, phrases différentes : c'est l'échantillonnage en action.</div>`;
    };
  };
  render();
}

/* ---- Manche : choix multiple ---- */
function rMcq(r){
  maxScore+=100;
  app.innerHTML = topbar()+`<span class="tag">${r.tag}</span><h2>${r.title}</h2><p>${r.question}</p>
    <div class="options" style="grid-template-columns:1fr">${r.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===r.answer; if(ok) score+=100;
    log.push(`${r.title} — Mon choix : ${txt(r.options[i])} (${ok?'bonne réponse':'mauvaise réponse; bonne réponse : '+txt(r.options[r.answer])}). +${ok?100:0} pts`);
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.i===r.answer) x.classList.add("correct"); else if(x===b) x.classList.add("wrong");});
    app.querySelector("#fb").innerHTML=`<div class="feedback ${ok?'good':'bad'}"><h3>${ok?'Bonne réponse! +100 points':'Pas tout à fait.'}</h3>
      ${r.bars?`<div>${r.bars.label}</div>${barsHTML(r.bars.options)}`:""}
      <div class="lesson">${r.lesson}</div></div>${nextBtn()}`;
    animateBars();
    document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

/* ---- Bilan ---- */
function end(){
  const ratio=score/maxScore;
  const date=new Date().toLocaleDateString("fr-CA",{year:"numeric",month:"long",day:"numeric"});
  app.innerHTML = `<span class="tag">Bilan</span><h2>${GAME_TITLE} — Mon bilan</h2>
    <p style="color:var(--muted);margin:0">${date}</p>
    <p class="score-big">${score} / ${maxScore}</p>
    <p>${ratio>=0.8?"Bravo : tu as très bien saisi la logique probabiliste d'un LLM!":ratio>=0.5?"Bon travail : tu as compris l'essentiel. Revois les manches où tu as hésité.":"Tu viens de découvrir une logique bien différente de la pensée humaine. Rejoue pour la consolider!"}</p>
    <div class="feedback"><h3>Mes réponses</h3><ol class="recap">${log.map(l=>`<li>${l}</li>`).join("")}</ol></div>
    <div class="feedback" style="margin-top:14px"><h3>Ce qu'il faut retenir</h3>
    <ul class="recap">${RECAP.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="feedback good" style="margin-top:14px"><h3>📋 Copie-colle cette page dans ton OneNote ou ton portfolio</h3>
      <p style="margin:0">Clique sur le bouton pour copier ton bilan, puis colle-le (Ctrl + V) dans ton OneNote ou ton portfolio. Tu peux aussi sélectionner toute la page (Ctrl + A) et la copier (Ctrl + C).</p>
      <div class="row"><button class="btn" id="copy">📋 Copier mon bilan</button><span id="copied" style="font-weight:700;color:var(--good)"></span></div></div>
    <div class="row"><button class="btn ghost" onclick="restart()">Rejouer</button></div>`;
  document.getElementById("copy").onclick=()=>{
    const text=[`${GAME_TITLE} — Mon bilan (${date})`,`Score : ${score} / ${maxScore}`,"","Mes réponses :",...log.map((l,i)=>`${i+1}. ${l}`),"","Ce qu'il faut retenir :",...RECAP.map(x=>"• "+txt(x)),"","Inspiré du Jeu éducatif sur l'IA pour les élèves du primaire de l'École branchée. Généré par l'IA."].join("\n");
    const ok=()=>document.getElementById("copied").textContent="✔ Copié! Colle-le dans ton OneNote ou ton portfolio.";
    const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){}ta.remove();};
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(ok,fallback); else fallback();
  };
}
function restart(){ idx=-1; score=0; maxScore=0; log=[]; go(); }

intro();
</script>
